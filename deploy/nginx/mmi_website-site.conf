# Public website. Copy to /etc/nginx/conf.d/mmi_website-site.conf on the VPS.
#
# This is the HTTP-only starting point. `certbot --nginx -d mergecoal.com -d www.mergecoal.com` REWRITES
# the live file in place (adds the 443 block and the HTTP -> HTTPS redirect). So never overwrite the live
# file from this template afterwards: edit the live file instead.
#
# 3140 must match APP_PORT in /opt/mmi_website/.env.

server {
    listen 80;
    listen [::]:80;
    server_name mergecoal.com www.mergecoal.com;

    # Optional: keep the site private while it is being built. Create the password file with
    #   htpasswd -c /etc/nginx/mmi_website.htpasswd someone
    # then uncomment both lines and `nginx -t && systemctl reload nginx`. Remove them at launch.
    # auth_basic "MMI";
    # auth_basic_user_file /etc/nginx/mmi_website.htpasswd;

    # The public site never accepts large uploads. nginx's default of 1 MB is what we want here.

    location / {
        proxy_pass http://127.0.0.1:3140;
        proxy_http_version 1.1;
        # The app tells the public site and the editor apart by this header, so it must be the real host.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
