# The editor, at cms.mmiinternal.online. Copy to /etc/nginx/conf.d/mmi_website-cms.conf on the VPS.
#
# This host sits behind Cloudflare (orange cloud) and reuses the existing wildcard Origin CA certificate,
# exactly like the other *.mmiinternal.online apps. Do NOT edit /etc/nginx/conf.d/mmiinternal.conf (IT owns
# it). Instead, copy the `listen 443`, `ssl_certificate` and `ssl_certificate_key` lines from one of the
# vhosts in that file into the marked place below, so this one uses the same certificate and settings.
#
# 3140 must match APP_PORT in /opt/mmi_website/.env.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cms.mmiinternal.online;

    # >>> REPLACE: paste the ssl_certificate / ssl_certificate_key lines used by the other
    # >>> *.mmiinternal.online vhosts here (and any ssl_protocols / http2 lines they use).
    # ssl_certificate     /path/from/mmiinternal.conf;
    # ssl_certificate_key /path/from/mmiinternal.conf;

    # Photo uploads: up to 20 MB, plus form overhead. Only this host needs it, not the public site.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3140;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Cloudflare's own header carries the visitor's real IP; the app reads it for login rate limiting,
        # so leave nginx's default of passing request headers through.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Resizing a large photo can take a few seconds.
        proxy_read_timeout 120s;
    }
}
