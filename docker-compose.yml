# Runs the website and the editor as ONE container on the shared VPS. Follows the other apps' pattern:
# bound to localhost only (nginx is the only way in), memory capped, on the shared Postgres network.
#
#   docker compose up -d --build                         start / update
#   docker compose run --rm tools npm run db:migrate     one-off scripts (see README.md)

services:
  app:
    build:
      context: .
      target: runner
    container_name: mmi_website_app
    restart: unless-stopped
    env_file: .env
    environment:
      # Pinned here too: Docker sets its own HOSTNAME otherwise. Must be 0.0.0.0 (see the Dockerfile).
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      # Host port is APP_PORT from .env. Pick one that is free: `ss -ltnp | grep 31`.
      - "127.0.0.1:${APP_PORT:-3140}:3000"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app_net
      - postgres_net
    # The VPS has 8 GB, no swap, and runs other apps. Resizing a 20 MB photo is the peak load.
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Not started by `up`. Used as: docker compose run --rm tools npm run <script>
  tools:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
    networks:
      - postgres_net
    mem_limit: 512m

networks:
  app_net:
    driver: bridge
  postgres_net:
    external: true # created by /opt/postgres/docker-compose.yml. Do not redefine.
